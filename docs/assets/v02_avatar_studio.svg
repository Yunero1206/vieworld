<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" fill="#151426"/>
  
  <!-- Demo Header Banner -->
  <rect x="0" y="0" width="1200" height="36" fill="#FFF4E5"/>
  <text x="30" y="23" fill="#7A4100" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bản thử nghiệm · Dữ liệu và tương tác mô phỏng (VieWorld v0.1.0 — Slot V02: Avatar Studio)</text>
  <rect x="1070" y="6" width="100" height="24" rx="12" fill="#6551C8"/>
  <text x="1120" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEMO</text>

  <!-- Title -->
  <text x="60" y="80" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">QUẢN TRỊ VÒNG ĐỜI TÀI SẢN AVATAR NGHỆ SĨ (§2.3, §5.1, P11)</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Avatar Studio — Asset Lifecycle, Quarantining &amp; Governance</text>

  <!-- Left: Live Preview Stage with Avatar Silhouette -->
  <rect x="60" y="150" width="460" height="475" rx="16" fill="#201E3C" stroke="#6551C8" stroke-width="1.5"/>
  <text x="90" y="185" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">XEM TRƯỚC SÂN KHẤU (LIVE PREVIEW)</text>

  <!-- Stage Box -->
  <rect x="90" y="205" width="400" height="280" rx="12" fill="#151426" stroke="#374151" stroke-width="1"/>
  <circle cx="290" cy="320" r="85" fill="#6551C8" opacity="0.2"/>
  <ellipse cx="290" cy="450" rx="130" ry="20" fill="rgba(255,255,255,0.05)" stroke="#A9E5D4" stroke-width="1"/>

  <!-- SVG Avatar Vector -->
  <g transform="translate(240, 240)">
    <!-- Aura -->
    <circle cx="50" cy="50" r="45" fill="#A9E5D4" opacity="0.3"/>
    <!-- Torso -->
    <path d="M20 135 C20 105 35 95 50 95 C65 95 80 105 80 135 Z" fill="#201E3C" stroke="#6551C8" stroke-width="2"/>
    <path d="M35 95 L45 120 L50 110 L55 120 L65 95" stroke="#A9E5D4" stroke-width="1.5"/>
    <!-- Head -->
    <rect x="44" y="75" width="12" height="22" rx="3" fill="#FCD34D"/>
    <circle cx="50" cy="60" r="26" fill="#FDE68A" stroke="#20212B" stroke-width="1.5"/>
    <!-- Hair -->
    <path d="M25 55 C25 35 35 28 50 28 C65 28 75 35 75 55 C70 48 62 48 50 52 C38 48 30 48 25 55 Z" fill="#312E81"/>
    <!-- Eyes -->
    <circle cx="42" cy="60" r="2.5" fill="#1E1B4B"/>
    <circle cx="58" cy="60" r="2.5" fill="#1E1B4B"/>
    <!-- Visor accessory -->
    <rect x="30" y="52" width="40" height="8" rx="2" fill="#A9E5D4" opacity="0.8"/>
  </g>

  <!-- Live Stage Indicator -->
  <rect x="90" y="500" width="400" height="105" rx="8" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="110" y="528" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NGĂN CÁCH BẢN NHÁP VỚI PHIÊN LIVE (INVARIANT §5.1)</text>
  <text x="110" y="555" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">Bản nháp (draft) được thử nghiệm an toàn trong Studio.</text>
  <text x="110" y="580" fill="#34D399" font-family="system-ui, sans-serif" font-size="12">Tuyệt đối không rò rỉ vào phiên trực tiếp của khán giả cho đến khi được phê duyệt.</text>

  <!-- Right: Asset Lifecycle & Controls -->
  <rect x="560" y="150" width="580" height="475" rx="16" fill="#201E3C" stroke="#374151" stroke-width="1.5"/>
  <text x="590" y="185" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">QUY TRÌNH PHÊ DUYỆT &amp; DANH SÁCH LINH KIỆN</text>

  <!-- Asset Status Workflow Steps -->
  <g transform="translate(590, 210)">
    <!-- Step 1: Draft -->
    <rect x="0" y="0" width="160" height="70" rx="8" fill="#151426" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="16" y="26" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BƯỚC 1: DRAFT</text>
    <text x="16" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Bản nháp đang sửa</text>

    <!-- Arrow -->
    <path d="M165 35 L180 35" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Step 2: Approved -->
    <rect x="185" y="0" width="160" height="70" rx="8" fill="#151426" stroke="#34D399" stroke-width="2"/>
    <text x="201" y="26" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BƯỚC 2: APPROVED</text>
    <text x="201" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Đã duyệt (Gán mã)</text>

    <!-- Arrow -->
    <path d="M350 35 L365 35" stroke="#9CA3AF" stroke-width="2"/>

    <!-- Step 3: Retired -->
    <rect x="370" y="0" width="150" height="70" rx="8" fill="#151426" stroke="#EF4444" stroke-width="1"/>
    <text x="386" y="26" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BƯỚC 3: RETIRED</text>
    <text x="386" y="48" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Đã ngừng dùng</text>
  </g>

  <!-- Part Manifest Inspector Box -->
  <rect x="590" y="305" width="520" height="150" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="610" y="333" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BẢNG KÊ LINH KIỆN (ASSET MANIFEST) · v0.1.0</text>
  <text x="610" y="362" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="13">• Base: <tspan fill="#FFFFFF" font-weight="600">stage_classic</tspan> (Phong cách sân khấu chuẩn mực)</text>
  <text x="610" y="388" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="13">• Outfit: <tspan fill="#FFFFFF" font-weight="600">midnight_jacket</tspan> (Áo khoác xanh đêm diễn)</text>
  <text x="610" y="414" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="13">• Accessory: <tspan fill="#FFFFFF" font-weight="600">festival_visor</tspan> (Kính lễ hội phát sáng)</text>
  <text x="610" y="440" fill="#34D399" font-family="system-ui, sans-serif" font-size="12">Mã phê duyệt: approvalRef: "appr_av_a_v1_live"</text>

  <!-- Constitutional Notice Box -->
  <rect x="590" y="475" width="520" height="130" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="610" y="503" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RANH GIỚI MINH BẠCH VỀ CÔNG NGHỆ (§2.3, §4)</text>
  <text x="610" y="530" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Không sử dụng tính năng tải ảnh cá nhân hay sao chép khuôn mặt (No Face Cloning).</text>
  <text x="610" y="555" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Đồ họa vector SVG gốc 100%, không yêu cầu quyền camera hay cảm biến sinh trắc.</text>
  <text x="610" y="580" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Tài sản avatar đại diện cho tính cách sân khấu nghệ thuật, không phải bằng chứng xác thực người thật.</text>
</svg>
