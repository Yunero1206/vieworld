<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" fill="#151426"/>
  
  <!-- Demo Header Banner -->
  <rect x="0" y="0" width="1200" height="36" fill="#FFF4E5"/>
  <text x="30" y="23" fill="#7A4100" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bản thử nghiệm · Dữ liệu và tương tác mô phỏng (VieWorld v0.1.0 — Slot V05: My World)</text>
  <rect x="1070" y="6" width="100" height="24" rx="12" fill="#6551C8"/>
  <text x="1120" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEMO</text>

  <!-- Title -->
  <text x="60" y="80" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">KHÔNG GIAN LIÊN TỤC CÁ NHÂN &amp; ĐỐI SOÁT HỖ TRỢ (§1, §3.3, P06, P09)</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">My World Hub (/me) — Moment Capsules, Wardrobe &amp; Support Recovery</text>

  <!-- Left: My World Continuity Hub -->
  <rect x="60" y="150" width="560" height="475" rx="16" fill="#201E3C" stroke="#6551C8" stroke-width="1.5"/>
  <text x="90" y="185" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HỒ SƠ KHÁN GIẢ: LINH (fan-linh) · KHÔNG GIAN BẢO TOÀN</text>

  <!-- Moment Capsule Card Showcase -->
  <rect x="90" y="205" width="500" height="150" rx="12" fill="#151426" stroke="#A9E5D4" stroke-width="1"/>
  <rect x="110" y="225" width="120" height="24" rx="12" fill="#0F766E"/>
  <text x="170" y="241" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MOMENT CAPSULE</text>
  <text x="245" y="242" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">capsule-artist-a-live-01</text>
  <text x="110" y="280" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Viên Nang Kỷ Niệm: Phiên Trực Tiếp Cùng Artist A</text>
  <text x="110" y="308" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="13">Đã tham gia phòng trực tiếp · Ghi nhận câu hỏi · Đóng góp bình chọn</text>
  <text x="110" y="332" fill="#34D399" font-family="system-ui, sans-serif" font-size="12">Chứng chỉ tham gia thực tế: live_attendance: true · Bền vững sau khi F5 refresh</text>

  <!-- Wardrobe Accessory Persistence -->
  <rect x="90" y="370" width="500" height="100" rx="12" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="110" y="398" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TỦ PHỤ KIỆN KHÁN GIẢ (WARDROBE CUSTOMIZER)</text>
  <text x="110" y="425" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">Phụ kiện đang chọn: Vòng Tay Phát Sáng Lễ Hội (Glow Band)</text>
  <text x="110" y="450" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Tùy biến ngoại hình cá nhân tồn lưu độc lập, KHÔNG ảnh hưởng đến quyền lợi hội viên.</text>

  <!-- Order & Entitlement Summary -->
  <rect x="90" y="485" width="500" height="120" rx="12" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="110" y="513" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LỊCH SỬ ĐƠN HÀNG VÀ QUYỀN LỢI ĐÃ NHẬN</text>
  <text x="110" y="540" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Đơn hàng VieSHOP: Huy hiệu pin lưu niệm (#ord_pin_01) — <tspan fill="#34D399" font-weight="700">Đã giao (fulfilled)</tspan></text>
  <text x="110" y="565" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Quyền lợi: Xem lại buổi diễn (Replay Access) — <tspan fill="#60A5FA" font-weight="700">Đã nhận (claimed)</tspan></text>
  <text x="110" y="588" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Dữ liệu được cô lập trong namespace vieworld_v1_vieworld-demo_fan-linh.</text>

  <!-- Right: Post-Order Support & Decoupled Reconciliation -->
  <rect x="660" y="150" width="480" height="475" rx="16" fill="#201E3C" stroke="#374151" stroke-width="1.5"/>
  <text x="690" y="185" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HỖ TRỢ SAU ĐƠN HÀNG &amp; ĐỐI SOÁT ĐỘC LẬP (P09, DEC-008)</text>

  <!-- Case Flow Card -->
  <rect x="690" y="205" width="420" height="150" rx="12" fill="#151426" stroke="#6551C8" stroke-width="1.5"/>
  <text x="710" y="235" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HỒ SƠ KHIẾU NẠI (SUPPORT CASE #case_support_01)</text>
  <text x="710" y="265" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Trạng thái: ĐÃ XỬ LÝ (RESOLVED)</text>
  <text x="710" y="292" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="12">Ghi chú vận hành: "Đã xác minh fan đủ điều kiện vé sớm. Thực hiện mở đối soát."</text>
  <text x="710" y="325" fill="#F87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">QUY TẮC: XỬ LÝ CA KHÔNG TỰ ĐỘNG CẤP QUYỀN LỢI!</text>

  <!-- Decoupled Reconciliation Action Box -->
  <rect x="690" y="370" width="420" height="140" rx="12" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="710" y="398" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HÀNH ĐỘNG ĐỐI SOÁT ĐỘC LẬP (RECONCILIATION STEP)</text>
  <text x="710" y="425" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">Thao tác "Đồng bộ đối soát" (RECONCILE) là bước tách biệt.</text>
  <text x="710" y="450" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">Sau khi nhấn đối soát: Quyền lợi mới chuyển từ pending → eligible.</text>
  <text x="710" y="475" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">Người hâm mộ có thể tự tay nhấn "Nhận quyền lợi" một cách minh bạch.</text>

  <!-- Idempotency & Clean Recovery -->
  <rect x="690" y="525" width="420" height="80" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="710" y="552" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TÍNH TOÀN VẸN VÀ TỰ PHỤC HỒI DỮ LIỆU</text>
  <text x="710" y="575" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Mỗi yêu cầu tạo case được gắn requestId. Bấm gửi lặp lại không tạo case rác.</text>
</svg>
