<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" fill="#151426"/>
  
  <!-- Demo Header Banner -->
  <rect x="0" y="0" width="1200" height="36" fill="#FFF4E5"/>
  <text x="30" y="23" fill="#7A4100" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bản thử nghiệm · Dữ liệu và tương tác mô phỏng (VieWorld v0.1.0 — Slot V04: Session Variants)</text>
  <rect x="1070" y="6" width="100" height="24" rx="12" fill="#6551C8"/>
  <text x="1120" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEMO</text>

  <!-- Title -->
  <text x="60" y="80" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">BIẾN THỂ PHIÊN: PHÒNG NGHE NHẠC &amp; LIVE HOUSE MINI-CONCERT (P13, DEC-012)</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Unified Session Contract Variants &amp; User-Initiated Audio</text>

  <!-- Left Card: Listening Room (session-listening-01) -->
  <rect x="60" y="150" width="520" height="475" rx="16" fill="#201E3C" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="85" y="175" width="130" height="24" rx="12" fill="#0F766E"/>
  <text x="150" y="191" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LISTENING ROOM</text>
  <text x="230" y="193" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">/sessions/session-listening-01</text>
  <text x="85" y="235" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Phòng Nghe Album Độc Quyền</text>

  <!-- Track Notes Panel -->
  <rect x="85" y="255" width="470" height="180" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="105" y="282" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GHI CHÚ CA KHÚC (TRACK NOTES PANEL)</text>
  <text x="105" y="312" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Bài 01: Vũ Trụ Nhỏ (03:45)</text>
  <text x="105" y="335" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">Ghi chú: Lấy cảm hứng từ những chuyến đi đêm và tiếng mưa trên ban công.</text>
  <text x="105" y="365" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Bài 02: Màn Đêm Và Tôi (04:12)</text>
  <text x="105" y="388" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">Ghi chú: Sử dụng máy tổng hợp âm analog cổ điển để tạo chất âm trầm ấm.</text>
  <text x="105" y="415" fill="#34D399" font-family="system-ui, sans-serif" font-size="11">Phân đoạn đang phát: ĐÃ GHI TRƯỚC (RECORDED) · Nhãn chính trực</text>

  <!-- User-Initiated Audio Invariant -->
  <rect x="85" y="450" width="470" height="150" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="105" y="478" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NGUYÊN TẮC: KHÔNG TỰ ĐỘNG PHÁT ÂM THANH (NO AUTOPLAY)</text>
  <text x="105" y="505" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Khi khán giả vào phòng, âm thanh ở trạng thái TẠM DỪNG (PAUSED).</text>
  <text x="105" y="530" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Bắt buộc có thao tác nhấn nút rõ ràng để bắt đầu nghe.</text>
  <text x="105" y="555" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Nếu thỏa thuận bản quyền hết hạn, tính năng phát lập tức bị khóa.</text>
  <text x="105" y="580" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Không bao giờ cào dữ liệu phát từ Spotify, YouTube hay dịch vụ bản quyền bên thứ ba.</text>

  <!-- Right Card: Live House Mini-Concert (session-livehouse-01) -->
  <rect x="620" y="150" width="520" height="475" rx="16" fill="#201E3C" stroke="#6551C8" stroke-width="1.5"/>
  <rect x="645" y="175" width="100" height="24" rx="12" fill="#6551C8"/>
  <text x="695" y="191" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LIVE HOUSE</text>
  <text x="760" y="193" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">/sessions/session-livehouse-01</text>
  <text x="645" y="235" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Mini-Concert Sân Khấu Mở</text>

  <!-- Setlist Panel -->
  <rect x="645" y="255" width="470" height="180" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="665" y="282" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DANH SÁCH BIỂU DIỄN (SETLIST PANEL)</text>
  <text x="665" y="312" fill="#D8D9E1" font-family="system-ui, sans-serif" font-size="13">#1: Intro Lễ Hội — <tspan fill="#34D399" font-weight="700">Đã biểu diễn (Completed)</tspan></text>
  <text x="665" y="338" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">#2: Thành Phố Ngủ Say — <tspan fill="#FBBF24" font-weight="700">Đang biểu diễn (Performing)</tspan></text>
  <text x="665" y="364" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">#3: Khúc Hát Đêm — Sắp diễn (Upcoming)</text>
  <text x="665" y="390" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">#4: Encore Bất Ngờ — Sắp diễn (Upcoming)</text>
  <text x="665" y="415" fill="#A9E5D4" font-family="system-ui, sans-serif" font-size="11">Cung cấp thanh định hướng mẫu phát (Call-Sample Cue Bar) cho fan tương tác.</text>

  <!-- Contract Reuse Invariant -->
  <rect x="645" y="450" width="470" height="150" rx="10" fill="#151426" stroke="#374151" stroke-width="1"/>
  <text x="665" y="478" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TÁI SỬ DỤNG HỢP ĐỒNG PHIÊN THỐNG NHẤT (CONTRACT REUSE)</text>
  <text x="665" y="505" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Cùng sử dụng route chuẩn /sessions/:sessionId.</text>
  <text x="665" y="530" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Cùng hỗ trợ hệ thống vé/hội viên và trao Moment Capsule sau phiên.</text>
  <text x="665" y="555" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">• Biến thể được cấu hình qua trường format, không nhân bản trang.</text>
  <text x="665" y="580" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Đảm bảo toàn vẹn kiến trúc và giảm thiểu rủi ro phân mảnh mã nguồn.</text>
</svg>
