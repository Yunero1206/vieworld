services:
  # Cấu hình 1: Web Service (Node.js runtime lắng nghe cổng $PORT)
  - type: web
    name: vieworld-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20

  # Cấu hình 2: Static Site (Khuyến nghị cho SPA - Nhanh, CDN toàn cầu & Miễn phí)
  - type: web
    name: vieworld-static
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
